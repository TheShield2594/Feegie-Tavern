# Cozy Cove static server.
#
# The cache policy here is the answer to the open question in ASSET_PLAN §9.9.
# Vite content-hashes its bundle output but copies `public/` verbatim, so the
# two kinds of file that end up in `dist/` need opposite caching and cannot
# share one rule:
#
#   /assets/index-<hash>.js      hashed   — safe to cache forever
#   /assets/models/nature.glb    verbatim — same URL across deploys
#   /assets/audio/*.ogg          verbatim — same URL across deploys
#
# Both live under /assets/ because Vite's default `assetsDir` is "assets" and
# `public/assets/` copies alongside it. They are told apart by subdirectory
# rather than by moving the build output, so no build config has to change.
# nginx evaluates regex locations before prefix locations, so the verbatim rule
# below wins over the immutable one regardless of the order they appear in.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # .glb is not in nginx's default mime.types.
    types {
        model/gltf-binary            glb;
        audio/ogg                    ogg;
        font/woff2                   woff2;
        font/ttf                     ttf;
        text/html                    html;
        text/css                     css;
        application/javascript       js;
        application/json             json map;
        image/png                    png;
        image/svg+xml                svg;
        image/jpeg                   jpg jpeg;
    }
    default_type application/octet-stream;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # .ogg is already compressed; .glb is float vertex data and does compress.
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary font/ttf;

    # Game assets copied straight from public/. Their URLs do not change between
    # deploys, so they must revalidate — otherwise a browser that cached the old
    # nature.glb keeps it after a new image ships. "no-cache" means revalidate,
    # not "do not store": unchanged files come back as a 304 with no body.
    location ~ ^/assets/(models|audio|textures|fonts)/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Vite's hashed output. The hash changes whenever the contents do, so these
    # can be cached indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The entry point must never be cached, or it will keep pointing at bundle
    # hashes that no longer exist in the image.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
